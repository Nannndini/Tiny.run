services:
  postgres:
    image: postgres:16-alpine
    container_name: tinyrun-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tiny
      POSTGRES_PASSWORD: tiny
      POSTGRES_DB: tinyrun
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiny -d tinyrun"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tinyrun-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data: