name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tiny
          POSTGRES_PASSWORD: tiny
          POSTGRES_DB: tinyrun
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tiny -d tinyrun"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://tiny:tiny@localhost:5432/tinyrun

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run db:generate
      - run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma
      - run: npm run lint
      - run: npm test
